name: Synthetic checks / Проверки
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: keto-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
      - name: Repository hygiene and pinned artifacts
        run: python scripts/verify_repository.py
      - name: Isolated dependencies, no cloud credentials
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          npm ci --prefix ui-sdk --ignore-scripts
      - name: Deterministic Python tests
        run: .venv/bin/python -m pytest -q tests/test_service.py tests/test_oauth_bridge.py tests/test_edge_candidate.py tests/test_edge_bridge.py library/skills/keto-companion/tests/test_core.py
      - name: Synthetic Worker and UI checks
        run: |
          node --test cloudflare-saas/tests/*.test.mjs
          node tests/test_ui_no_browser.cjs
          node tests/test_oauth_ui.cjs
      - name: Reproducible build verification
        run: |
          node cloudflare-saas/build.cjs
          python scripts/verify_repository.py
